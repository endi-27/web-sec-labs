services:

  postgres:
    image: postgres:16-alpine
    container_name: web_sec_postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${DB_USER:-websec_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-websec_password}
      POSTGRES_DB: ${DB_NAME:-websec_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-websec_user} -d ${DB_NAME:-websec_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web_sec_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_sec_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-websec_user}
      DB_PASSWORD: ${DB_PASSWORD:-websec_password}
      DB_NAME: ${DB_NAME:-websec_db}
    volumes:
      - ./src:/app/src:z
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - web_sec_network

volumes:
  postgres_data:

networks:
  web_sec_network:
    driver: bridge
