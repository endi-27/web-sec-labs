[project]
name = "web-sec-labs"
version = "0.1.0"
description = "Web Security Labs Backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uuid6>=2024.7.1",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.9.0",
    "types-aiofiles>=24.1.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
env_files = [".env.test", "../.env.test", "../.env", ".env"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 120
force-exclude = true

exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "W",   # Pycodestyle warnings
    "F",   # Pyflakes (syntax, imports, unused variables)
    "I",   # Isort (import ordering)
    "B",   # Flake8-bugbear (common design and async pitfalls)
    "UP",  # Pyupgrade (modern Python syntax)
    "SIM", # Flake8-simplify
]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "alembic",
]

[tool.pyrefly]
project-includes = [
    "src",
    "tests",
    "scripts",
    "alembic",
]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
]
search-path = [
    ".",
    "src",
]

[tool.pyrefly.errors]
bad-override = "ignore"
